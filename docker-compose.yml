services:
  db:
    image: postgres:16
    restart: unless-stopped
    container_name: task_queue_db
    environment:
      POSTGRES_DB: task_queue_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    container_name: task_queue_redis
    ports:
      - "6379:6379"

  app:
    build: .
    restart: unless-stopped
    container_name: task_queue_app
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: "dbname=task_queue_api user=postgres password=postgres host=db port=5432"
      SECRET_KEY: "docker-dev-secret-key"
      REDIS_URL: "redis://redis:6379"
    ports:
      - "5001:5000"
    command: python app.py

  worker:
    build: .
    restart: unless-stopped
    container_name: task_queue_worker
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: "dbname=task_queue_api user=postgres password=postgres host=db port=5432"
      SECRET_KEY: "docker-dev-secret-key"
      REDIS_URL: "redis://redis:6379"
      PYTHONUNBUFFERED: "1"
    command: python worker.py

volumes:
  postgres_data: